name: Deploy to Production

on:
  push:
    branches:
      - 'v4.x'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'yarn'
          
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install Node Dependencies
        run: yarn --frozen-lockfile

      - name: Build Assets
        run: yarn build

      - name: Generate Wayfinder dependencies
        run: php artisan wayfinder:generate --with-form

      - name: Install SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PERSONAL_PRIVATE_ID_RSA }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Scans the host key to prevent "Host key verification failed" errors
          ssh-keyscan -H ${{ secrets.PERSONAL_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Clean up resources
        run: |
          rm -fR ./node_modules
          rm -fR ./resources/css
          rm -fR ./resources/js

      - name: Move files to server with rsync
        run: |
          rsync -arvz ./ ${{ secrets.PERSONAL_PRODUCTION_USERNAME }}@${{ secrets.PERSONAL_PRODUCTION_HOST }}:~/Personal

      - name: Rsync files to directory
        run: |
          ssh ${{ secrets.PERSONAL_PRODUCTION_USERNAME }}@${{ secrets.PERSONAL_PRODUCTION_HOST }} sudo rsync -arvz ./Personal/ /var/www/personal/

      - name: Fix permissions
        run: |
          ssh ${{ secrets.PERSONAL_PRODUCTION_USERNAME }}@${{ secrets.PERSONAL_PRODUCTION_HOST }} "cd /var/www && sudo chown -fR www-data:www-data personal"

      - name: Remove deployment directory
        run: |
          ssh ${{ secrets.PERSONAL_PRODUCTION_USERNAME }}@${{ secrets.PERSONAL_PRODUCTION_HOST }} rm -fR Personal

      - name: Run deployment artisan sequence
        run: |
          ssh ${{ secrets.PERSONAL_PRODUCTION_USERNAME }}@${{ secrets.PERSONAL_PRODUCTION_HOST }} "cd /var/www/personal && php artisan optimize:clear"
          ssh ${{ secrets.PERSONAL_PRODUCTION_USERNAME }}@${{ secrets.PERSONAL_PRODUCTION_HOST }} "cd /var/www/personal && php artisan migrate --force"

      - name: Cleanup 
        run: |
          ssh ${{ secrets.PERSONAL_PRODUCTION_USERNAME }}@${{ secrets.PERSONAL_PRODUCTION_HOST }} rm -fR Personal