name: Deploy to Production

on:
  push:
    branches:
      - 'v4.x'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Add Flux Credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Prepare for Build
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Remove build-time .env
        run: rm -f .env

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-build
          path: |
            *
            !.env
            !.git
            !.github

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: Production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: personal-build

      - name: Set up SSH
        run: |
          install -m 600 -d ~/.ssh
          echo "${{ secrets.PERSONAL_PRIVATE_ID_RSA }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PERSONAL_PRODUCTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Backup on server (files + database)
        env:
          DEPLOY_HOST: ${{ secrets.PERSONAL_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PERSONAL_PRODUCTION_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" << 'REMOTE'
          set -e
          cd /var/www/personal
          BACKUP_NAME="personal-backup-$(date +%Y%m%d-%H%M%S).tar.gz"
          DUMP_FILE="/tmp/personal-db-$$.sql"

          # Archive site files to /home/admin
          tar -czf "/home/admin/$BACKUP_NAME" -C /var/www personal

          # Database dump (MySQL/MariaDB; adjust for PostgreSQL/SQLite if needed)
          if grep -q '^DB_CONNECTION=mysql' .env 2>/dev/null; then
            export $(grep -E '^DB_(DATABASE|USERNAME|PASSWORD|HOST)=' .env | xargs)
            mysqldump -h "${DB_HOST:-127.0.0.1}" -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" > "$DUMP_FILE" 2>/dev/null || true
            if [ -s "$DUMP_FILE" ]; then
              gunzip "/home/admin/$BACKUP_NAME"
              tar -rf "/home/admin/${BACKUP_NAME%.gz}" -C /tmp "$(basename "$DUMP_FILE")"
              gzip "/home/admin/${BACKUP_NAME%.gz}"
            fi
            rm -f "$DUMP_FILE"
          fi
          echo "Backup saved: /home/admin/$BACKUP_NAME"
          REMOTE

      - name: Deploy files (preserve .env)
        env:
          DEPLOY_HOST: ${{ secrets.PERSONAL_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PERSONAL_PRODUCTION_USERNAME }}
        run: |
          rsync -avz --rsh="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='.git' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/personal/"

      - name: Post-deploy (migrate, cache)
        env:
          DEPLOY_HOST: ${{ secrets.PERSONAL_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PERSONAL_PRODUCTION_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" "cd /var/www/personal && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache"
